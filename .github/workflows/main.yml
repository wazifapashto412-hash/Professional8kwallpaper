name: Infinity 8K Wallpapers - Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Check Project Files
        shell: bash
        run: |
          echo "Checking Android project..."

          ls -la

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "ERROR: Android app Gradle file is missing."
            exit 1
          fi

          echo "Project files found."

      - name: Check Gradle Version
        run: gradle --version

      - name: Build APK and AAB
        shell: bash
        run: |
          gradle \
            assembleDebug \
            bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Show Build Outputs
        if: always()
        shell: bash
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true

          echo "AAB files:"
          find app/build/outputs/bundle -type f -name "*.aab" 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-8K-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-8K-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 7

      - name: Build Result
        if: always()
        run: |
          echo "Android build workflow finished."
          echo "Check the previous steps for compilation errors."
